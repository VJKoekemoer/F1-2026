<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="F1 2026">
<meta name="theme-color" content="#08080f">
<title>F1 2026 Championship</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Barlow+Condensed:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #08080f;
    --surface: #0b0b14;
    --surface2: #0f0f1c;
    --border: #131320;
    --border2: #1e1e35;
    --red: #e10600;
    --text: #e8e8f0;
    --muted: #3a3a55;
    --dim: #2a2a3f;
    --font-body: 'DM Sans', sans-serif;
    --font-display: 'Barlow Condensed', sans-serif;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    padding-bottom: 48px;
    -webkit-font-smoothing: antialiased;
  }

  /* HEADER */
  .header {
    padding: 22px 18px 18px;
    background: #0d0d16;
    border-bottom: 1px solid var(--border);
  }
  .eyebrow {
    font-family: var(--font-display);
    font-size: 11px;
    letter-spacing: 4px;
    color: var(--red);
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .title {
    font-family: var(--font-display);
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -0.5px;
    line-height: 1;
    color: #f0f0f8;
  }
  .subtitle {
    font-size: 11px;
    color: #2a2a45;
    margin-top: 6px;
    letter-spacing: 0.5px;
    font-weight: 400;
  }

  /* TABS */
  .tabs {
    display: flex;
    background: #0d0d16;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .tab {
    flex: 1;
    padding: 13px 0;
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    font-family: var(--font-display);
    font-size: 12px;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s;
    font-weight: 400;
  }
  .tab.active {
    color: var(--red);
    border-bottom-color: var(--red);
    font-weight: 700;
  }

  /* PANELS */
  .panel { display: none; padding: 10px 12px 0; }
  .panel.active { display: block; }

  /* CARD */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 6px;
    padding: 11px 14px;
    position: relative;
    overflow: hidden;
  }
  .card.top3 {
    background: var(--surface2);
    border-color: var(--border2);
  }
  .team-bar {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    border-radius: 10px 0 0 10px;
  }
  .card-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding-left: 8px;
  }
  .pos {
    font-family: var(--font-display);
    width: 26px;
    text-align: center;
    font-size: 13px;
    font-weight: 800;
    color: var(--dim);
    flex-shrink: 0;
  }
  .pos.p1 { font-size: 18px; color: #ffd700; }
  .pos.p2 { font-size: 18px; color: #c0c0c0; }
  .pos.p3 { font-size: 18px; color: #cd7f32; }
  .name {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    letter-spacing: 0.2px;
  }
  .team-label {
    font-family: var(--font-display);
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-top: 2px;
    font-weight: 600;
  }
  .pts-wrap { text-align: right; }
  .pts-num {
    font-family: var(--font-display);
    font-size: 22px;
    font-weight: 800;
    color: #9090b0;
    line-height: 1;
  }
  .pts-num.leader { color: #ffffff; }
  .pts-lbl {
    font-family: var(--font-display);
    font-size: 9px;
    color: var(--dim);
    letter-spacing: 2px;
  }
  .bar-wrap {
    height: 2px;
    margin-top: 9px;
    margin-left: 6px;
    background: #0f0f1c;
    border-radius: 1px;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    border-radius: 1px;
    transition: width 0.5s ease;
  }

  /* CALENDAR */
  .cal-card {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 6px;
  }
  .cal-card.done { background: #09090f; }
  .cal-card.current { background: #0d1a0d; border-color: #1a3a1a; }
  .round-dot {
    width: 26px; height: 26px;
    border-radius: 50%;
    background: var(--surface2);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-display);
    font-size: 11px; font-weight: 700;
    color: var(--muted);
    flex-shrink: 0;
  }
  .round-dot.done { color: var(--dim); font-size: 13px; }
  .round-dot.current { background: #00aa00; color: #fff; }
  .cal-name {
    font-size: 13px;
    font-weight: 500;
    color: #9090b0;
  }
  .cal-name.done { color: var(--dim); }
  .cal-name.current { color: #44dd44; font-weight: 700; }
  .cal-badge {
    font-family: var(--font-display);
    font-size: 9px;
    letter-spacing: 2px;
    color: #44dd44;
    background: #0a200a;
    padding: 2px 6px;
    border-radius: 3px;
    margin-left: 8px;
  }
  .cal-meta {
    font-family: var(--font-display);
    font-size: 10px;
    color: #1e1e2f;
    letter-spacing: 1px;
    margin-top: 2px;
  }

  /* BUTTON */
  .update-btn {
    display: block;
    width: calc(100% - 24px);
    margin: 16px 12px 0;
    padding: 15px;
    background: var(--red);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-family: var(--font-display);
    font-size: 13px;
    letter-spacing: 3px;
    text-transform: uppercase;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
  }
  .update-btn:disabled {
    background: #1a1a2a;
    color: var(--muted);
    cursor: not-allowed;
  }
  .status-msg {
    font-size: 11px;
    text-align: center;
    margin-top: 10px;
    min-height: 16px;
    padding: 0 12px;
    font-weight: 500;
  }
  .status-msg.ok { color: #00cc66; }
  .status-msg.err { color: var(--red); }
</style>
</head>
<body>

<div class="header">
  <div class="eyebrow">Formula 1 · 2026 Season</div>
  <div class="title">Championship<br>Standings</div>
  <div class="subtitle" id="last-updated">AFTER ROUND 5 — CANADA</div>
</div>

<div class="tabs">
  <button class="tab active" onclick="setTab('drivers')">Drivers</button>
  <button class="tab" onclick="setTab('constructors')">Constructors</button>
  <button class="tab" onclick="setTab('calendar')">Calendar</button>
</div>

<div id="panel-drivers" class="panel active"></div>
<div id="panel-constructors" class="panel active" style="display:none"></div>
<div id="panel-calendar" class="panel active" style="display:none"></div>

<button class="update-btn" id="update-btn" onclick="autoUpdate()">⟳  Auto-Update Standings</button>
<div class="status-msg" id="status-msg"></div>

<script>
const TEAM_COLORS = {
  "Mercedes":"#00D2BE","Ferrari":"#DC0000","McLaren":"#FF8000",
  "Red Bull":"#3671C6","Alpine":"#FF87BC","Aston Martin":"#358C75",
  "Williams":"#64C4FF","Racing Bulls":"#6692FF","Haas":"#B6BABD",
  "Audi":"#B5B5B7","Cadillac":"#C8102E"
};
const TEAM_FLAGS = {
  "Mercedes":"🇩🇪","Ferrari":"🇮🇹","McLaren":"🇬🇧","Red Bull":"🇦🇹",
  "Alpine":"🇫🇷","Aston Martin":"🇬🇧","Williams":"🇬🇧","Racing Bulls":"🇮🇹",
  "Haas":"🇺🇸","Audi":"🇩🇪","Cadillac":"🇺🇸"
};
const MEDALS = ["🥇","🥈","🥉"];

const RACES = [
  {r:1,name:"Australia",date:"8 Mar",done:true},
  {r:2,name:"China",date:"15 Mar",done:true},
  {r:3,name:"Japan",date:"29 Mar",done:true},
  {r:4,name:"Miami",date:"3 May",done:true},
  {r:5,name:"Canada",date:"24 May",done:true},
  {r:6,name:"Monaco",date:"7 Jun",done:false,current:true},
  {r:7,name:"Barcelona",date:"14 Jun",done:false},
  {r:8,name:"Austria",date:"28 Jun",done:false},
  {r:9,name:"Britain",date:"5 Jul",done:false},
  {r:10,name:"Belgium",date:"19 Jul",done:false},
  {r:11,name:"Hungary",date:"26 Jul",done:false},
  {r:12,name:"Netherlands",date:"23 Aug",done:false},
  {r:13,name:"Italy",date:"6 Sep",done:false},
  {r:14,name:"Azerbaijan",date:"26 Sep",done:false},
  {r:15,name:"Singapore",date:"11 Oct",done:false},
  {r:16,name:"USA",date:"19 Oct",done:false},
];

const DEFAULT_DRIVERS = [
  {name:"Kimi Antonelli",team:"Mercedes",pts:131},
  {name:"George Russell",team:"Mercedes",pts:88},
  {name:"Charles Leclerc",team:"Ferrari",pts:75},
  {name:"Lewis Hamilton",team:"Ferrari",pts:72},
  {name:"Lando Norris",team:"McLaren",pts:58},
  {name:"Oscar Piastri",team:"McLaren",pts:48},
  {name:"Max Verstappen",team:"Red Bull",pts:44},
  {name:"Franco Colapinto",team:"Alpine",pts:14},
  {name:"Isack Hadjar",team:"Red Bull",pts:13},
  {name:"Esteban Ocon",team:"Haas",pts:12},
  {name:"Arvid Lindblad",team:"Racing Bulls",pts:12},
  {name:"Pierre Gasly",team:"Alpine",pts:11},
  {name:"Jack Doohan",team:"Alpine",pts:10},
  {name:"Yuki Tsunoda",team:"Racing Bulls",pts:9},
  {name:"Alex Albon",team:"Williams",pts:7},
  {name:"Gabriel Bortoleto",team:"Audi",pts:5},
  {name:"Fernando Alonso",team:"Aston Martin",pts:4},
  {name:"Oliver Bearman",team:"Haas",pts:0},
  {name:"Lance Stroll",team:"Aston Martin",pts:0},
  {name:"Carlos Sainz",team:"Williams",pts:0},
  {name:"Nico Hulkenberg",team:"Audi",pts:0},
  {name:"Sergio Perez",team:"Cadillac",pts:0},
];

const DEFAULT_CONSTRUCTORS = [
  {team:"Mercedes",pts:219},
  {team:"Ferrari",pts:147},
  {team:"McLaren",pts:106},
  {team:"Red Bull",pts:57},
  {team:"Alpine",pts:35},
  {team:"Racing Bulls",pts:21},
  {team:"Haas",pts:19},
  {team:"Williams",pts:7},
  {team:"Audi",pts:5},
  {team:"Aston Martin",pts:4},
  {team:"Cadillac",pts:0},
];

// State
let drivers = [], constructors = [], lastUpdated = "After Round 5 — Canada";

function sorted(arr) {
  return [...arr].sort((a,b) => b.pts - a.pts).map((x,i) => ({...x, pos: i+1}));
}

function load() {
  try {
    const d = localStorage.getItem("f1_drivers_v2");
    const c = localStorage.getItem("f1_constructors_v2");
    const l = localStorage.getItem("f1_last_updated_v2");
    drivers = d ? JSON.parse(d) : sorted(DEFAULT_DRIVERS);
    constructors = c ? JSON.parse(c) : sorted(DEFAULT_CONSTRUCTORS);
    lastUpdated = l || "After Round 5 — Canada";
  } catch {
    drivers = sorted(DEFAULT_DRIVERS);
    constructors = sorted(DEFAULT_CONSTRUCTORS);
  }
}

function save() {
  try {
    localStorage.setItem("f1_drivers_v2", JSON.stringify(drivers));
    localStorage.setItem("f1_constructors_v2", JSON.stringify(constructors));
    localStorage.setItem("f1_last_updated_v2", lastUpdated);
  } catch {}
}

function setTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p => p.style.display = 'none');
  event.target.classList.add('active');
  document.getElementById('panel-' + name).style.display = 'block';
}

function render() {
  document.getElementById('last-updated').textContent = lastUpdated.toUpperCase();

  // Drivers
  const maxD = drivers[0]?.pts || 1;
  const dp = document.getElementById('panel-drivers');
  dp.innerHTML = drivers.map((d, i) => `
    <div class="card${i < 3 ? ' top3' : ''}">
      <div class="team-bar" style="background:${TEAM_COLORS[d.team]||'#333'}"></div>
      <div class="card-row">
        <div class="pos${i===0?' p1':i===1?' p2':i===2?' p3':''}">${i < 3 ? MEDALS[i] : d.pos}</div>
        <div style="flex:1">
          <div class="name">${d.name}</div>
          <div class="team-label" style="color:${TEAM_COLORS[d.team]||'#555'}">${TEAM_FLAGS[d.team]||''} ${d.team}</div>
        </div>
        <div class="pts-wrap">
          <div class="pts-num${i===0?' leader':''}">${d.pts}</div>
          <div class="pts-lbl">PTS</div>
        </div>
      </div>
      <div class="bar-wrap">
        <div class="bar-fill" style="width:${(d.pts/maxD*100).toFixed(1)}%;background:${TEAM_COLORS[d.team]||'#333'}"></div>
      </div>
    </div>
  `).join('');

  // Constructors
  const maxC = constructors[0]?.pts || 1;
  const cp = document.getElementById('panel-constructors');
  cp.innerHTML = constructors.map((c, i) => `
    <div class="card${i < 3 ? ' top3' : ''}">
      <div class="team-bar" style="background:${TEAM_COLORS[c.team]||'#333'}"></div>
      <div class="card-row">
        <div class="pos${i===0?' p1':i===1?' p2':i===2?' p3':''}">${i < 3 ? MEDALS[i] : c.pos}</div>
        <div style="flex:1">
          <div class="name">${c.team}</div>
          <div class="team-label" style="color:#2a2a3f">${TEAM_FLAGS[c.team]||''} CONSTRUCTOR</div>
        </div>
        <div class="pts-wrap">
          <div class="pts-num${i===0?' leader':''}">${c.pts}</div>
          <div class="pts-lbl">PTS</div>
        </div>
      </div>
      <div class="bar-wrap">
        <div class="bar-fill" style="width:${(c.pts/maxC*100).toFixed(1)}%;background:${TEAM_COLORS[c.team]||'#333'}"></div>
      </div>
    </div>
  `).join('');

  // Calendar
  const cal = document.getElementById('panel-calendar');
  cal.innerHTML = RACES.map(r => `
    <div class="cal-card${r.done?' done':r.current?' current':''}">
      <div class="round-dot${r.done?' done':r.current?' current':''}">${r.done ? '✓' : r.r}</div>
      <div style="flex:1">
        <div class="cal-name${r.done?' done':r.current?' current':''}">
          ${r.name}${r.current ? '<span class="cal-badge">THIS WEEKEND</span>' : ''}
        </div>
        <div class="cal-meta">ROUND ${r.r} · ${r.date}</div>
      </div>
    </div>
  `).join('');
}

async function autoUpdate() {
  const btn = document.getElementById('update-btn');
  const status = document.getElementById('status-msg');
  btn.disabled = true;
  btn.textContent = '⏳  Fetching latest standings...';
  status.textContent = 'Searching the web for current F1 standings...';
  status.className = 'status-msg';

  try {
    const prompt = `Search the web right now for the current 2026 F1 Formula 1 championship standings after the most recent completed race. Return ONLY a JSON object, no other text or markdown, in exactly this format:
{"lastUpdated":"After Round X — RaceName","drivers":[{"name":"Full Name","team":"TeamName","pts":123}],"constructors":[{"team":"TeamName","pts":456}]}
Team names must be exactly one of: Mercedes, Ferrari, McLaren, Red Bull, Alpine, Aston Martin, Williams, Racing Bulls, Haas, Audi, Cadillac.
All drivers and all 11 teams must be included. Return only valid JSON, nothing else.`;

    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-20250514",
        max_tokens: 1000,
        tools: [{ type: "web_search_20250305", name: "web_search" }],
        messages: [{ role: "user", content: prompt }],
      }),
    });

    const data = await response.json();
    const textBlocks = (data.content || []).filter(b => b.type === "text");
    if (!textBlocks.length) throw new Error("No response");

    const raw = textBlocks[textBlocks.length - 1].text;
    const jsonMatch = raw.replace(/```json|```/g, "").match(/\{[\s\S]*\}/);
    if (!jsonMatch) throw new Error("No JSON");

    const parsed = JSON.parse(jsonMatch[0]);

    drivers = sorted(parsed.drivers.map(d => ({
      name: d.name, team: d.team, pts: Number(d.pts) || 0
    })));
    constructors = sorted(parsed.constructors.map(c => ({
      team: c.team, pts: Number(c.pts) || 0
    })));
    lastUpdated = parsed.lastUpdated || "Latest standings";

    save();
    render();
    status.textContent = '✓ Standings updated successfully!';
    status.className = 'status-msg ok';
  } catch (e) {
    status.textContent = 'Could not update — check your connection and try again.';
    status.className = 'status-msg err';
  }

  btn.disabled = false;
  btn.textContent = '⟳  Auto-Update Standings';
  setTimeout(() => { status.textContent = ''; status.className = 'status-msg'; }, 4000);
}

// Init
load();
render();
</script>
</body>
</html>
